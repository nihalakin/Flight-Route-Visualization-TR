<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş Yap · Nodia</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-sm">
        <!-- Başlık -->
        <div class="text-center mb-8">
            <h1 class="text-2xl font-semibold text-gray-900">nodia</h1>
            <p class="text-sm text-gray-500 mt-1">Hesabına giriş yap</p>
        </div>

        <!-- Kart -->
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6">
            <form id="loginForm" class="space-y-5">
                <!-- E-posta -->
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700 mb-1.5">E-posta adresin</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        required
                        class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:bg-white focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 outline-none transition"
                        placeholder="ornek@email.com"
                    >
                </div>
                
                <!-- Şifre -->
                <div>
                    <div class="flex items-center justify-between mb-1.5">
                        <label for="password" class="block text-sm font-medium text-gray-700">Şifre</label>
                        <button 
                            type="button" 
                            id="forgotPasswordBtn"
                            class="text-xs text-blue-600 hover:text-blue-700 font-medium"
                        >
                            Şifremi unuttum
                        </button>
                    </div>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        required
                        class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:bg-white focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 outline-none transition"
                        placeholder="••••••••"
                    >
                </div>
                
                <!-- Hata mesajı -->
                <div id="errorMessage" class="hidden bg-red-50 border border-red-200 text-red-600 px-4 py-3 rounded-xl text-sm" role="alert">
                    <span id="errorText" class="block"></span>
                </div>
                
                <!-- Başarı mesajı -->
                <div id="successMessage" class="hidden bg-green-50 border border-green-200 text-green-600 px-4 py-3 rounded-xl text-sm" role="alert">
                    <span id="successText" class="block"></span>
                </div>
                
                <!-- Giriş butonu -->
                <button 
                    type="submit" 
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 px-4 rounded-xl transition duration-200 text-sm"
                >
                    Giriş yap
                </button>
            </form>
            
            <!-- Üye ol bağlantısı (next parametresi ile, giriş sonrası aynı sayfaya dönülebilir) -->
            <p class="mt-6 text-center text-sm text-gray-500">
                Henüz hesabın yok mu?
                <a href="/register" id="registerLink" class="text-blue-600 hover:text-blue-700 font-medium">Hesap oluştur</a>
            </p>
        </div>

        <!-- Alt bilgi (isteğe bağlı) -->
        <p class="text-center text-xs text-gray-400 mt-6">
            Nodia · Giriş yaparak kullanım koşullarını kabul etmiş olursun
        </p>
    </div>

    <script>
        (function() {
            // Giriş sonrası yönlendirilecek sayfa: URL'deki next parametresi (sadece aynı origin path)
            var params = new URLSearchParams(window.location.search);
            var nextUrl = params.get('next') || '/';
            if (nextUrl.indexOf('//') !== -1 || (nextUrl[0] === '/' && nextUrl.length > 1 && nextUrl.indexOf('\\') !== -1)) {
                nextUrl = '/';
            }
            if (nextUrl !== '/' && nextUrl[0] !== '/') nextUrl = '/' + nextUrl;

            // Üye ol linkine next parametresini ekle (kayıttan sonra girişe, oradan da aynı sayfaya dönülsün)
            var registerLink = document.getElementById('registerLink');
            if (registerLink && nextUrl && nextUrl !== '/') {
                registerLink.href = '/register?next=' + encodeURIComponent(nextUrl);
            }

            var apiBase = window.location.origin;

            var forgotBtn = document.getElementById('forgotPasswordBtn');
            if (forgotBtn) {
                forgotBtn.addEventListener('click', async function () {
                    var errorDiv = document.getElementById('errorMessage');
                    var successDiv = document.getElementById('successMessage');
                    var errorText = document.getElementById('errorText');
                    var successText = document.getElementById('successText');
                    errorDiv.classList.add('hidden');
                    successDiv.classList.add('hidden');

                    var emailInput = document.getElementById('email');
                    var email = (emailInput.value || '').trim();
                    if (!email) {
                        errorText.textContent = 'Lütfen önce e-posta adresinizi girin.';
                        errorDiv.classList.remove('hidden');
                        emailInput.focus();
                        return;
                    }

                    try {
                        var resp = await fetch(apiBase + '/api/forgot-password', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ email: email })
                        });
                        var data;
                        try { data = await resp.json(); } catch (_) { data = {}; }

                        if (resp.ok) {
                            successText.textContent = data.message || 'Eğer bu email sistemimizde kayıtlı ise, şifre sıfırlama bağlantısı gönderildi.';
                            successDiv.classList.remove('hidden');
                        } else {
                            var msg = data.detail || data.message || 'İşlem gerçekleştirilemedi. Lütfen daha sonra tekrar deneyin.';
                            errorText.textContent = msg;
                            errorDiv.classList.remove('hidden');
                        }
                    } catch (err) {
                        errorText.textContent = 'Bağlantı hatası: ' + (err.message || 'Sunucuya ulaşılamadı.');
                        errorDiv.classList.remove('hidden');
                    }
                });
            }

            document.getElementById('loginForm').addEventListener('submit', async function(e) {
                e.preventDefault();
                var errorDiv = document.getElementById('errorMessage');
                var successDiv = document.getElementById('successMessage');
                var errorText = document.getElementById('errorText');
                var successText = document.getElementById('successText');
                errorDiv.classList.add('hidden');
                successDiv.classList.add('hidden');

                var formData = new FormData();
                formData.append('username', document.getElementById('email').value);
                formData.append('password', document.getElementById('password').value);

                try {
                    var response = await fetch(apiBase + '/api/login', { method: 'POST', body: formData });
                    var data;
                    try { data = await response.json(); } catch (_) {
                        errorText.textContent = 'Sunucu yanıtı işlenemedi.';
                        errorDiv.classList.remove('hidden');
                        return;
                    }
                    if (response.ok) {
                        localStorage.setItem('access_token', data.access_token);
                        successText.textContent = 'Giriş başarılı. Yönlendiriliyorsun...';
                        successDiv.classList.remove('hidden');

                        // Kullanıcı rolünü öğren ve admin / normal kullanıcıya göre yönlendir
                        var token = data.access_token;
                        fetch(apiBase + '/api/me', {
                            headers: { 'Authorization': 'Bearer ' + token }
                        })
                        .then(function(meRes) { return meRes.json(); })
                        .then(function(me) {
                            if (me && me.is_admin) {
                                window.location.href = '/admin/dashboard';
                            } else {
                                window.location.href = '/profile';
                            }
                        })
                        .catch(function() {
                            // Her ihtimale karşı profil sayfasına gönder
                            window.location.href = '/profile';
                        });
                    } else {
                        var msg = (data.detail && (typeof data.detail === 'string' ? data.detail : data.detail.map(function(x) { return x.msg || x.loc; }).join(', '))) || data.message || 'Giriş başarısız.';
                        errorText.textContent = msg;
                        errorDiv.classList.remove('hidden');
                    }
                } catch (err) {
                    errorText.textContent = 'Bağlantı hatası: ' + (err.message || 'Sunucuya ulaşılamadı.');
                    errorDiv.classList.remove('hidden');
                }
            });
        })();
    </script>
</body>
</html>
