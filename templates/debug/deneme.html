<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Living Room Art Preview</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    display:flex;
    height:100vh;
    overflow:hidden;
}

/* CONTROL PANEL */

.controls{
    width:260px;
    background:#ffffff;
    padding:20px;
    box-shadow:0 0 20px rgba(0,0,0,0.15);
    z-index:20;
}

.controls h2{
    font-size:16px;
    margin-top:20px;
}

button{
    width:100%;
    padding:10px;
    margin-bottom:10px;
    border:none;
    cursor:pointer;
    background:#f2f2f2;
    transition:0.3s;
}

button:hover{
    background:#ddd;
}

/* ROOM CONTAINER */

.room{
    flex:1;
    position:relative;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
}

/* LIVING ROOM IMAGE */

.room-bg{
    position:absolute;
    width:100%;
    height:100%;
    background:url("https://images.unsplash.com/photo-1505691938895-1758d7feb511") center/cover no-repeat;
    z-index:1;
}

/* COLOR OVERLAY */

.wall-overlay{
    position:absolute;
    width:100%;
    height:100%;
    background:rgba(241,239,229,0.6);
    mix-blend-mode:multiply;
    transition:0.6s;
    z-index:2;
}

/* PAINTING */

.painting{
    width:400px;
    height:250px;
    background:url("https://upload.wikimedia.org/wikipedia/commons/5/50/Joaquin_Sorolla_-_Children_on_the_Beach_-_Google_Art_Project.jpg") center/cover;
    border:12px solid white;
    box-shadow:0 20px 40px rgba(0,0,0,0.5);
    z-index:5;
    position:relative;
    transition:0.6s;
}

/* LIGHT EFFECTS */

.ceiling-light{
    position:absolute;
    width:100%;
    height:100%;
    background:radial-gradient(circle at center 15%, rgba(255,255,255,0.6), transparent 60%);
    pointer-events:none;
    opacity:1;
    transition:0.6s;
    z-index:6;
}

.spot-light{
    position:absolute;
    bottom:30%;
    width:250px;
    height:300px;
    background:radial-gradient(circle, rgba(255,255,200,0.9), transparent 70%);
    filter:blur(40px);
    pointer-events:none;
    opacity:0;
    transition:0.6s;
    z-index:6;
}

.spot-left{
    left:35%;
}

.spot-right{
    right:35%;
}

.vignette{
    position:absolute;
    width:100%;
    height:100%;
    background:radial-gradient(circle, transparent 60%, rgba(0,0,0,0.5));
    pointer-events:none;
    opacity:0;
    transition:0.6s;
    z-index:7;
}

</style>
</head>
<body>

<div class="controls">
    <h2>Duvar Rengi</h2>
    <button onclick="changeWall('rgba(241,239,229,0.6)')">Bej</button>
    <button onclick="changeWall('rgba(255,255,255,0.5)')">Beyaz</button>
    <button onclick="changeWall('rgba(200,200,200,0.6)')">Açık Gri</button>
    <button onclick="changeWall('rgba(70,70,70,0.7)')">Koyu Gri</button>

    <h2>Işık Modu</h2>
    <button onclick="ceilingMode()">Tavan Lambası</button>
    <button onclick="spotMode()">Zemin Spotları</button>
</div>

<div class="room">
    <div class="room-bg"></div>
    <div class="wall-overlay" id="wallOverlay"></div>

    <div class="painting"></div>

    <div class="ceiling-light" id="ceilingLight"></div>
    <div class="spot-light spot-left" id="spotLeft"></div>
    <div class="spot-light spot-right" id="spotRight"></div>
    <div class="vignette" id="vignette"></div>
</div>

<script>

function changeWall(color){
    document.getElementById("wallOverlay").style.background = color;
}

function ceilingMode(){
    document.getElementById("ceilingLight").style.opacity = 1;
    document.getElementById("spotLeft").style.opacity = 0;
    document.getElementById("spotRight").style.opacity = 0;
    document.getElementById("vignette").style.opacity = 0;
}

function spotMode(){
    document.getElementById("ceilingLight").style.opacity = 0;
    document.getElementById("spotLeft").style.opacity = 1;
    document.getElementById("spotRight").style.opacity = 1;
    document.getElementById("vignette").style.opacity = 1;
}

</script>

</body>
</html>
