<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hesap Oluştur · Nodia</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gradient-to-br from-[#007e8a]/20 via-[#007e8a]/10 to-white min-h-screen flex items-center justify-center p-4 relative">
    <!-- Bulanık arka plan -->
    <div class="absolute inset-0 bg-white/40 backdrop-blur-md"></div>
    
    <div class="w-full max-w-md relative z-10">
        <!-- Kart -->
        <div class="bg-white rounded-3xl shadow-sm border border-gray-100 p-6">
            <!-- Logo ve Başlık -->
            <div class="text-center mb-8">
                <img src="/static/img/nodia-logo.png" alt="Nodia Logo" class="w-20 h-20 mx-auto rounded-2xl">
                <h1 class="text-2xl font-bold text-[#007e8a] mt-4">Nodia</h1>
                <p class="text-sm text-gray-500 mt-1">Yeni hesap oluştur</p>
            </div>
            <form id="registerForm" class="space-y-6">
                <!-- Ad Soyad grid -->
                <div class="grid grid-cols-2 gap-6">
                    <div>
                        <label for="firstname" class="block text-sm font-medium text-gray-700 mb-2">Ad</label>
                        <input 
                            type="text" 
                            id="firstname" 
                            name="firstname" 
                            required
                            class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:bg-white focus:ring-2 focus:ring-[#007e8a]/20 focus:border-[#007e8a] outline-none transition"
                            placeholder="Ad"
                        >
                    </div>
                    
                    <div>
                        <label for="lastname" class="block text-sm font-medium text-gray-700 mb-2">Soyad</label>
                        <input 
                            type="text" 
                            id="lastname" 
                            name="lastname" 
                            required
                            class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:bg-white focus:ring-2 focus:ring-[#007e8a]/20 focus:border-[#007e8a] outline-none transition"
                            placeholder="Soyad"
                        >
                    </div>
                </div>

                <!-- Kullanıcı adı -->
                <div>
                    <label for="username" class="block text-sm font-medium text-gray-700 mb-2">Kullanıcı adı</label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        required
                        class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:bg-white focus:ring-2 focus:ring-[#007e8a]/20 focus:border-[#007e8a] outline-none transition"
                        placeholder="ornek_kullanici"
                    >
                    <p class="text-xs text-gray-500 mt-2">En az 3 karakter, yalnızca harf, rakam ve _ . - karakterleri.</p>
                </div>
                
                <!-- E-posta -->
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700 mb-2">E-posta adresi</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        required
                        class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:bg-white focus:ring-2 focus:ring-[#007e8a]/20 focus:border-[#007e8a] outline-none transition"
                        placeholder="ornek@email.com"
                    >
                </div>
                
                <!-- Şifre -->
                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-2">Şifre</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        required
                        class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:bg-white focus:ring-2 focus:ring-[#007e8a]/20 focus:border-[#007e8a] outline-none transition"
                        placeholder="••••••••"
                    >
                    <p class="text-xs text-gray-500 mt-2">En az 8 karakter, 1 büyük harf ve 1 rakam içermeli</p>
                </div>
                
                <!-- Hata mesajı -->
                <div id="errorMessage" class="hidden bg-red-50 border border-red-200 text-red-600 px-4 py-3 rounded-xl text-sm" role="alert">
                    <span id="errorText" class="block"></span>
                </div>
                
                <!-- Başarı mesajı -->
                <div id="successMessage" class="hidden bg-green-50 border border-green-200 text-green-600 px-4 py-3 rounded-xl text-sm" role="alert">
                    <span id="successText" class="block"></span>
                </div>
                
                <!-- Kayıt butonu -->
                <button 
                    type="submit" 
                    class="w-full bg-[#007e8a] hover:bg-[#006675] text-white font-medium py-2.5 px-4 rounded-xl transition duration-200 text-sm"
                >
                    Hesap oluştur
                </button>
            </form>
            
            <!-- Giriş yap bağlantısı -->
            <p class="mt-6 text-center text-sm text-gray-500">
                Zaten hesabın var mı?
                <a href="/login" class="text-[#007e8a] hover:text-[#006675] font-medium">Giriş yap</a>
            </p>
        </div>

        <!-- Alt bilgi -->
        <p class="text-center text-xs text-gray-400 mt-6">
            Hesap oluşturarak Nodia'nın kullanım koşullarını kabul etmiş olursun
        </p>
    </div>

    <script src="/static/js/auth/register.js"></script>
</body>
</html>
