<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Şifre Sıfırla · Nodia</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-sm">
        <!-- Başlık -->
        <div class="text-center mb-8">
            <h1 class="text-2xl font-semibold text-gray-900">nodia</h1>
            <p class="text-sm text-gray-500 mt-1">Yeni bir şifre belirle</p>
        </div>

        <!-- Kart -->
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6">
            <form id="resetForm" class="space-y-5">
                <!-- Yeni şifre -->
                <div>
                    <label for="newPassword" class="block text-sm font-medium text-gray-700 mb-1.5">
                        Yeni şifren
                    </label>
                    <input
                        type="password"
                        id="newPassword"
                        name="newPassword"
                        required
                        minlength="8"
                        class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:bg-white focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 outline-none transition"
                        placeholder="••••••••"
                    >
                    <p class="mt-1 text-xs text-gray-400">
                        En az 8 karakter, güçlü bir şifre seç.
                    </p>
                </div>

                <!-- Şifre tekrar -->
                <div>
                    <label for="confirmPassword" class="block text-sm font-medium text-gray-700 mb-1.5">
                        Şifreni tekrar gir
                    </label>
                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        required
                        minlength="8"
                        class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:bg-white focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 outline-none transition"
                        placeholder="••••••••"
                    >
                </div>

                <!-- Hata mesajı -->
                <div id="errorMessage" class="hidden bg-red-50 border border-red-200 text-red-600 px-4 py-3 rounded-xl text-sm" role="alert">
                    <span id="errorText" class="block"></span>
                </div>

                <!-- Başarı mesajı -->
                <div id="successMessage" class="hidden bg-green-50 border border-green-200 text-green-600 px-4 py-3 rounded-xl text-sm" role="alert">
                    <span id="successText" class="block"></span>
                </div>

                <!-- Şifre sıfırla butonu -->
                <button
                    type="submit"
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 px-4 rounded-xl transition duration-200 text-sm"
                >
                    Şifremi sıfırla
                </button>

                <p class="mt-4 text-center text-xs text-gray-400">
                    Bu bağlantı 30 dakika içinde geçerlidir.
                </p>
            </form>
        </div>

        <!-- Alt bilgi -->
        <p class="text-center text-xs text-gray-400 mt-6">
            Nodia · Şifreni unuttuysan burada yenileyebilirsin
        </p>
    </div>

    <script>
        (function () {
            var params = new URLSearchParams(window.location.search);
            var token = params.get('token');

            var errorDiv = document.getElementById('errorMessage');
            var successDiv = document.getElementById('successMessage');
            var errorText = document.getElementById('errorText');
            var successText = document.getElementById('successText');

            if (!token) {
                errorText.textContent = 'Geçersiz şifre sıfırlama bağlantısı.';
                errorDiv.classList.remove('hidden');
                document.getElementById('resetForm').querySelector('button[type=\"submit\"]').disabled = true;
                return;
            }

            var apiBase = window.location.origin;

            document.getElementById('resetForm').addEventListener('submit', async function (e) {
                e.preventDefault();
                errorDiv.classList.add('hidden');
                successDiv.classList.add('hidden');

                var newPassword = document.getElementById('newPassword').value;
                var confirmPassword = document.getElementById('confirmPassword').value;

                if (!newPassword || newPassword.length < 8) {
                    errorText.textContent = 'Lütfen en az 8 karakterden oluşan bir şifre girin.';
                    errorDiv.classList.remove('hidden');
                    return;
                }

                if (newPassword !== confirmPassword) {
                    errorText.textContent = 'Şifreler eşleşmiyor.';
                    errorDiv.classList.remove('hidden');
                    return;
                }

                try {
                    var resp = await fetch(apiBase + '/api/reset-password', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            token: token,
                            new_password: newPassword
                        })
                    });

                    var data;
                    try { data = await resp.json(); } catch (_) { data = {}; }

                    if (resp.ok) {
                        successText.textContent = data.message || 'Şifren başarıyla güncellendi. Giriş sayfasına yönlendiriliyorsun...';
                        successDiv.classList.remove('hidden');
                        setTimeout(function () {
                            window.location.href = '/login';
                        }, 2000);
                    } else {
                        var msg = data.detail || data.message || 'Geçersiz veya süresi dolmuş şifre sıfırlama bağlantısı.';
                        errorText.textContent = msg;
                        errorDiv.classList.remove('hidden');
                    }
                } catch (err) {
                    errorText.textContent = 'Bağlantı hatası: ' + (err.message || 'Sunucuya ulaşılamadı.');
                    errorDiv.classList.remove('hidden');
                }
            });
        })();
    </script>
</body>
</html>
