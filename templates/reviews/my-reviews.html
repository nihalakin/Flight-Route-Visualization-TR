<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yorumlarım · Nodia</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/global/base.css">
    <link rel="stylesheet" href="/static/css/global/components.css">
    <link rel="stylesheet" href="/static/css/global/main.css">
    <style>
        body {
            font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        .page-shell {
            padding: 2rem 0 4rem;
        }
        .page-header-simple {
            margin-bottom: 1.75rem;
        }
        .page-header-simple-title {
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin: 0 0 0.35rem;
            color: var(--text-primary);
        }
        .page-header-simple-desc {
            margin: 0;
            font-size: 0.95rem;
            color: var(--text-muted);
        }
        .reviews-card {
            background: #ffffff;
            border-radius: 24px;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border);
            padding: 1.75rem 1.75rem 1.5rem;
        }
        .reviews-card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.75rem;
            margin-bottom: 1.25rem;
            flex-wrap: wrap;
        }
        .reviews-card-title {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-primary);
        }
        .reviews-card-title-icon {
            width: 34px;
            height: 34px;
            border-radius: 999px;
            background: #fef3c7;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #f59e0b;
        }
        .reviews-card-sub {
            font-size: 0.85rem;
            color: var(--text-muted);
        }
        #myReviewsList {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .review-card {
            position: relative;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 1.25rem 1.5rem;
            box-shadow: 0 1px 3px rgba(15, 23, 42, 0.04);
            transition: box-shadow 0.2s ease, border-color 0.2s ease;
            overflow: hidden;
        }
        .review-card::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 4px;
            background: linear-gradient(180deg, #f59e0b 0%, #fbbf24 100%);
            border-radius: 4px 0 0 4px;
        }
        .review-card:hover {
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.08);
            border-color: #e2e8f0;
        }
        .review-card-header {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-start;
            justify-content: space-between;
            gap: 0.75rem;
            margin-bottom: 0.75rem;
        }
        .review-card-route {
            font-size: 0.95rem;
            font-weight: 600;
            color: #0f172a;
            line-height: 1.35;
            flex: 1;
            min-width: 0;
        }
        .review-card-meta {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            flex-wrap: wrap;
            flex-shrink: 0;
        }
        .review-card-date {
            font-size: 0.8rem;
            color: #64748b;
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
        }
        .review-card-date i {
            font-size: 0.75rem;
            color: #94a3b8;
        }
        .review-card-rating {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            padding: 0.35rem 0.65rem;
            background: linear-gradient(135deg, #fffbeb 0%, #fef3c7 100%);
            border: 1px solid #fde68a;
            border-radius: 999px;
            font-size: 0.8rem;
            font-weight: 600;
            color: #b45309;
        }
        .review-card-rating i {
            font-size: 0.75rem;
            color: #f59e0b;
        }
        .review-card-subtitle {
            font-size: 0.875rem;
            color: #64748b;
            margin-bottom: 0.5rem;
            line-height: 1.4;
        }
        .review-card-body {
            font-size: 0.9rem;
            color: #334155;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-word;
            padding-top: 0.75rem;
            border-top: 1px solid #f1f5f9;
        }
        .tickets-loading {
            font-size: 0.9rem;
            color: #64748b;
        }
        .tickets-loading .loading-spinner-inline {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #e2e8f0;
            border-top-color: #2563eb;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 6px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .tickets-empty {
            padding: 1.75rem 1rem 1.25rem;
            text-align: center;
            color: #64748b;
            font-size: 0.9rem;
        }
        .tickets-empty i {
            display: block;
            margin-bottom: 0.5rem;
        }
        @media (max-width: 768px) {
            .reviews-card {
                padding: 1.25rem 1.25rem 1rem;
            }
        }
    </style>
</head>
<body>
    <div id="navbar-container"></div>

    <main class="page-shell">
        <div class="container">
            <header class="page-header-simple">
                <h1 class="page-header-simple-title">Yorumlarım</h1>
                <p class="page-header-simple-desc">
                    Uçuşların için daha önce bıraktığın tüm değerlendirmeleri burada görebilirsin.
                </p>
            </header>

            <section class="reviews-card" aria-label="Kullanıcı yorumları">
                <div class="reviews-card-header">
                    <div class="reviews-card-title">
                        <span class="reviews-card-title-icon">
                            <i class="fas fa-comment-dots"></i>
                        </span>
                        <span>Yorumlarım</span>
                    </div>
                    <div class="reviews-card-sub">
                        <i class="fas fa-info-circle" style="margin-right:4px; color:#9ca3af;"></i>
                        Yorumlar, oluşturulma tarihine göre listelenir.
                    </div>
                </div>

                <div id="myReviewsLoading" class="tickets-loading" style="display:none;">
                    <span class="loading-spinner-inline"></span>Yorumlar yükleniyor...
                </div>
                <div id="myReviewsList"></div>
                <div id="myReviewsEmpty" class="tickets-empty" style="display:none;">
                    <i class="fas fa-comments" style="font-size: 2rem; color: #cbd5e1;"></i>
                    <p>Henüz bir yorum bırakmadın.</p>
                </div>
            </section>
        </div>
    </main>

    <script src="/static/js/global/navbar-loader.js"></script>
    <script>
        (function() {
            const token = localStorage.getItem('access_token');
            const apiBase = window.location.origin;

            if (!token) {
                window.location.href = '/login?next=/reviews/my-reviews';
                return;
            }

            function escapeHtml(s) {
                if (s == null) return '';
                var t = String(s);
                return t
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;');
            }

            function loadMyReviews() {
                var listEl = document.getElementById('myReviewsList');
                var loadingEl = document.getElementById('myReviewsLoading');
                var emptyEl = document.getElementById('myReviewsEmpty');
                if (!listEl) return;
                loadingEl.style.display = 'block';
                emptyEl.style.display = 'none';
                listEl.innerHTML = '';

                fetch(apiBase + '/api/reviews/me', {
                    headers: { 'Authorization': 'Bearer ' + token }
                })
                .then(function(r) {
                    if (r.status === 401) {
                        window.location.href = '/login?next=/reviews/my-reviews';
                        return [];
                    }
                    return r.json();
                })
                .then(function(reviews) {
                    loadingEl.style.display = 'none';
                    if (!reviews || !Array.isArray(reviews) || reviews.length === 0) {
                        emptyEl.style.display = 'block';
                        return;
                    }
                    emptyEl.style.display = 'none';

                    var frag = document.createDocumentFragment();
                    reviews.forEach(function(rv) {
                        var createdStr = rv.created_at
                            ? new Date(rv.created_at).toLocaleString('tr-TR', {
                                  day: '2-digit',
                                  month: '2-digit',
                                  year: 'numeric',
                                  hour: '2-digit',
                                  minute: '2-digit'
                              })
                            : '';
                        var flightLabel = (rv.flight_label || '').trim();
                        if (!flightLabel) {
                            var shortFromContent = (rv.content || '').substring(0, 60);
                            if ((rv.content || '').length > 60) shortFromContent += '…';
                            flightLabel = shortFromContent || 'Yorum';
                        }

                        var div = document.createElement('div');
                        div.className = 'review-card';
                        div.innerHTML =
                            '<div class="review-card-header">' +
                                '<div class="review-card-route">' + escapeHtml(flightLabel) + '</div>' +
                                '<div class="review-card-meta">' +
                                    '<span class="review-card-date"><i class="far fa-calendar-alt"></i>' + escapeHtml(createdStr) + '</span>' +
                                    '<span class="review-card-rating"><i class="fas fa-star"></i>' + (rv.rating || 0) + '/5</span>' +
                                '</div>' +
                            '</div>' +
                            (rv.title ? '<div class="review-card-subtitle">' + escapeHtml(rv.title) + '</div>' : '') +
                            '<div class="review-card-body">' + escapeHtml(rv.content || '') + '</div>';

                        frag.appendChild(div);
                    });
                    listEl.appendChild(frag);
                })
                .catch(function() {
                    loadingEl.style.display = 'none';
                    emptyEl.style.display = 'block';
                });
            }

            loadMyReviews();
        })();
    </script>
</body>
</html>
