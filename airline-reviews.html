<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Havayolu Yorumları - Nodia</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/base.css">
    <link rel="stylesheet" href="/static/css/components.css">
    <link rel="stylesheet" href="/static/css/main.css">
    <link rel="stylesheet" href="/static/css/airline-reviews.css">
</head>
<body>

    <div id="navbar-container"></div>

    <main class="airline-reviews-page">
        <div class="container">
            <header class="page-header">
                <div class="page-header-badge"><i class="fas fa-comment-dots"></i> Yorumlar</div>
                <h1>Havayolu Yorumları</h1>
                <p class="page-desc">Kullanıcılarımızın uçuş deneyimleri. Admin onayından geçen değerlendirmeler havayoluna göre listelenir.</p>
            </header>

            <div id="loading-state" class="loading-state">
                <span class="spinner"></span>
                <p>Yorumlar yükleniyor...</p>
            </div>

            <div id="empty-state" class="empty-state" style="display: none;">
                <div class="empty-icon"><i class="fas fa-comments"></i></div>
                <h3>Henüz yorum yok</h3>
                <p>Onaylanmış havayolu yorumları burada görünecek.</p>
            </div>

            <div id="content-area" class="content-area" style="display: none;">
                <div class="filter-bar">
                    <label for="airline-select" class="filter-label"><i class="fas fa-plane"></i> Havayolu</label>
                    <div class="select-wrapper">
                        <select id="airline-select" class="airline-select" aria-label="Havayolu seçin">
                            <option value="">Tüm havayolları</option>
                        </select>
                        <i class="fas fa-chevron-down select-arrow" aria-hidden="true"></i>
                    </div>
                    <span id="results-count" class="results-count"></span>
                </div>
                <div id="airline-sections" class="airline-sections"></div>
            </div>
        </div>
    </main>

    <script src="/static/js/navbar-loader.js"></script>
    <script src="/static/js/airline-reviews.js"></script>
</body>
</html>
