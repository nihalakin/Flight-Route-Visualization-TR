<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Havayolu Yorumları - Nodia</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/base.css">
    <link rel="stylesheet" href="/static/css/components.css">
    <link rel="stylesheet" href="/static/css/main.css">
    <link rel="stylesheet" href="/static/css/airline-reviews.css">
</head>
<body>

    <div id="navbar-container"></div>

    <main class="airline-reviews-page">
        <div class="container">
            <header class="page-header">
                <h1>Havayolu Yorumları</h1>
                <p class="page-desc">Kullanıcılarımızın havayolları hakkındaki onaylı değerlendirmeleri. Havayoluna göre filtrelenmiş listeler.</p>
            </header>

            <div id="loading-state" class="loading-state">
                <span class="spinner"></span>
                <p>Yorumlar yükleniyor...</p>
            </div>

            <div id="empty-state" class="empty-state" style="display: none;">
                <i class="fas fa-comments"></i>
                <p>Henüz onaylanmış yorum bulunmuyor.</p>
            </div>

            <div id="content-area" class="content-area" style="display: none;">
                <div id="airline-sections"></div>
            </div>
        </div>
    </main>

    <script src="/static/js/navbar-loader.js"></script>
    <script src="/static/js/airline-reviews.js"></script>
</body>
</html>
