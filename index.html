<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Türkiye Havalimanları Uçuş Ağı - Ana Sayfa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
    <link rel="stylesheet" href="/static/css/base.css">
    <link rel="stylesheet" href="/static/css/components.css">
    <link rel="stylesheet" href="/static/css/main.css">
    <link rel="stylesheet" href="/static/css/responsive.css">
    <link rel="stylesheet" href="/static/css/visualization.css">
    <link rel="stylesheet" href="/static/css/home.css">
</head>
<body>

    <div id="navbar-container"></div>

    <main class="page-content">
        <div class="container">
            <header>
                <h1>Türkiye Havalimanları Uçuş Ağı</h1>
            </header>
            <div class="map-container">
                <div class="route-controls">
                    <div>
                        <label for="from-airport">Kalkış Noktası:</label>
                        <select id="from-airport">
                            <option value="">-- Havalimanı Seçin --</option>
                        </select>
                    </div>
                    <div>
                        <label for="to-airport">Varış Noktası:</label>
                        <select id="to-airport">
                            <option value="">-- Havalimanı Seçin --</option>
                        </select>
                    </div>
                    <button id="show-route">Rotayı Göster</button>
                    <button id="show-network">Tüm Uçuş Ağını Göster</button>
                    <button id="clear-route">Temizle</button>
                </div>
                <div id="route-info" class="route-info"></div>
                <div id="route-details" class="route-details" style="display: none;"></div>
                <div id="network-stats" class="network-stats" style="display: none;"></div>
                <div class="legend">
                    <div class="legend-item">
                        <div class="legend-color" style="background-color: #8B0000;"></div>
                        <span>Uçuş Noktaları(10+)</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background-color: #FF4500;"></div>
                        <span>Uçuş Noktaları(5-9)</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background-color: #FFD700;"></div>
                        <span>Uçuş Noktaları(1-4)</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background-color: #10b981; border-radius: 0;"></div>
                        <span>Doğrudan Uçuş</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background-color: #ff9800; border-radius: 0;"></div>
                        <span>Aktarmalı Uçuş</span>
                    </div>
                </div>
                <div id="map"></div>
                <div class="status" id="status">
                    Bir havalimanının üzerine gelerek uçuş rotalarını görüntüleyin
                </div>
            </div>
            <div class="info-panel">
                <div class="info-title">Havalimanı Detayları</div>
                <div id="airport-info" class="airport-details">
                    <div class="airport-card">
                        <div class="airport-name">Bir havalimanı seçin</div>
                        <div class="airport-code">Haritadaki bir havalimanına tıklayarak detaylı bilgi görüntüleyin</div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="/static/js/navbar-loader.js"></script>
    <script src="/static/js/utils.js"></script>
    <script src="/static/js/flight-network.js"></script>
    <script src="/static/js/visualization.js"></script>
    <script src="/static/js/flight-filter.js"></script>
    <script src="/static/js/voice-commands.js"></script>
    <script src="/static/js/navigation.js"></script>
    <script src="/static/js/app.js"></script>
</body>
</html>
